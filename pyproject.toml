[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uogtad"
version = "0.1.0"
description = "Typed functional control containers for Python"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{name = "uogtad contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]
typecheck = ["mypy>=1.19", "pyright>=1.1.408"]

[tool.setuptools.package-data]
uogtad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["uogtad"]

[tool.mypy]
strict = true
files = ["uogtad"]

[tool.pyright]
pythonVersion = "3.15"
