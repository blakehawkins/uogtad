name: Lock

# Brings pixi.lock up to date with pyproject.toml on a pull request, committing
# it to the pull request's branch when it changes. A push made with
# GITHUB_TOKEN starts no pull_request workflow run, so this dispatches CI on
# the new commit itself. adrs/0003-refreshing-the-lockfile.md has the reasons.

on:
  pull_request:
    paths: [pyproject.toml, pixi.lock]

permissions: {}

concurrency:
  group: lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock:
    name: Refresh pixi.lock
    # A pull request from a fork gets a read-only token, so its branch cannot
    # be pushed to: CI's locked install tells its author the lock is stale.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # The branch itself, to commit to, rather than the merge commit CI tests.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          run-install: false
          cache: false
      - name: Update the lockfile
        run: pixi lock
      - name: Commit the lockfile and run CI on it
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "build: refresh pixi.lock" -- pixi.lock
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
