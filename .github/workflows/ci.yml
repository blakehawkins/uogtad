name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Run tests
        run: pixi run test

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Type-check with mypy and pyright
        run: pixi run typecheck

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Build source and wheel distributions
        run: pixi run package
      # In a virtualenv of its own, as a user's pip install would be: the pixi
      # environment holds uogtad editable, and the next pixi run would put that
      # back over a wheel installed there, so the smoke test would import the
      # source instead.
      - name: Install and smoke-test the wheel
        run: |
          pixi run python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/wheel/bin/python" -c "from importlib.resources import files; from uogtad import Either; assert Either.new(0).narrow().narrow() == 0; assert files('uogtad').joinpath('py.typed').is_file()"
