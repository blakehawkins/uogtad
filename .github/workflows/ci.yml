name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Install package and test dependencies
        run: pixi run python -m pip install ".[test]"
      - name: Run tests
        run: pixi run python -m pytest -q

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Install package and type-check dependencies
        run: pixi run python -m pip install ".[test,typecheck]"
      - name: Run mypy
        run: pixi run python -m mypy --strict uogtad
      - name: Run pyright
        run: pixi run pyright

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: Build source and wheel distributions
        run: pixi run package
      - name: Install and smoke-test the wheel
        run: |
          pixi run python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          pixi run --manifest-path "$GITHUB_WORKSPACE/pyproject.toml" python -c "from importlib.resources import files; from uogtad import Either; assert Either.new(0).narrow().narrow() == 0; assert files('uogtad').joinpath('py.typed').is_file()"
